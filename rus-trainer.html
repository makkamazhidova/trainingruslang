<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Тренажёр по русскому языку · ЕНТ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
html,body{margin:0;padding:0;}
.rt *{box-sizing:border-box;}
.rt{
  --brand:#5364af; --brand-deep:#3d4a8f; --brand-050:#eef0f9; --brand-100:#dde1f3;
  --ink:#22263f; --muted:#5c6178; --line:#e4e5ee; --paper:#f3f4f8; --surface:#fff;
  --ok:#1f9d6b; --ok-bg:#e8f6ef; --err:#d5604a; --err-bg:#fbede8;
  --teal:#e7f4ee; --teal-t:#137a51; --coral:#fbede7; --coral-t:#b0472c;
  font-family:'Onest',system-ui,sans-serif;color:var(--ink);
  background:var(--paper);min-height:100vh;width:100%;-webkit-font-smoothing:antialiased;
}
.rt-serif{font-family:'Lora',Georgia,serif;}
.rt-wrap{max-width:860px;margin:0 auto;padding:24px 18px 72px;}
.rt-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px;}
.rt-logo{font-weight:800;font-size:18px;letter-spacing:-.01em;}
.rt-logo b{color:var(--brand);}
.rt-back{border:none;background:none;color:var(--muted);font:inherit;font-size:14px;font-weight:600;cursor:pointer;padding:6px;}
.rt-back:hover{color:var(--ink);}

.rt-h1{font-size:27px;font-weight:800;letter-spacing:-.02em;margin:0 0 6px;line-height:1.15;}
.rt-lead{color:var(--muted);font-size:15px;margin:0 0 24px;line-height:1.5;max-width:56ch;}

/* course */
.rt-topics{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;}
.rt-topic{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:14px 15px;text-align:left;font:inherit;color:inherit;cursor:default;position:relative;}
.rt-topic.ready{cursor:pointer;border-color:var(--brand-100);}
.rt-topic.ready::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--brand);border-radius:11px 0 0 11px;}
.rt-topic.ready:hover{border-color:var(--brand);transform:translateY(-1px);transition:.15s;}
.rt-topic .name{font-size:15px;font-weight:600;}
.rt-topic .meta{font-size:12px;color:var(--muted);margin-top:3px;}
.rt-topic.ready .meta{color:var(--brand);font-weight:600;}

/* setup */
.rt-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:26px;}
.rt-setup-h{font-size:14px;font-weight:700;margin:0 0 12px;}
.rt-setup-h:not(:first-child){margin-top:26px;}
.rt-choices{display:flex;gap:10px;flex-wrap:wrap;}
.rt-choice{padding:11px 18px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);font:inherit;font-size:15px;font-weight:600;cursor:pointer;transition:.12s;}
.rt-choice:hover{border-color:var(--brand);}
.rt-choice.sel{border-color:var(--brand);background:var(--brand-050);color:var(--brand-deep);}
.rt-choice .sub{display:block;font-size:12px;font-weight:500;color:var(--muted);margin-top:2px;}
.rt-choice.sel .sub{color:var(--brand-deep);}
.rt-start{margin-top:28px;width:100%;border:none;background:var(--brand);color:#fff;font:inherit;font-weight:700;font-size:16px;padding:15px;border-radius:12px;cursor:pointer;transition:.12s;}
.rt-start:hover{background:var(--brand-deep);}
.rt-start:disabled{background:#c3c7dd;cursor:default;}
.rt-choice.soon{opacity:.5;cursor:default;}
.rt-choice.soon .sub{color:var(--muted);}

/* quiz */
.rt-prog{display:flex;align-items:center;gap:12px;margin-bottom:20px;}
.rt-bar{flex:1;height:6px;background:var(--line);border-radius:99px;overflow:hidden;}
.rt-bar i{display:block;height:100%;background:var(--brand);border-radius:99px;transition:width .35s cubic-bezier(.4,0,.2,1);}
.rt-num{font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap;}

.rt-q{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px;}
.rt-tags{display:flex;gap:7px;margin-bottom:14px;flex-wrap:wrap;}
.rt-tag{font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--brand-050);color:var(--brand-deep);}
.rt-tag.lvl{background:var(--paper);color:var(--muted);}
.rt-ctx{background:var(--paper);border-left:3px solid var(--brand);border-radius:0 8px 8px 0;padding:12px 14px;margin-bottom:14px;font-family:'Lora',serif;font-size:16px;font-style:italic;color:var(--ink);}
.rt-prompt{font-size:18px;font-weight:600;line-height:1.4;margin:0 0 18px;letter-spacing:-.01em;}

.rt-opts{display:flex;flex-direction:column;gap:9px;}
.rt-opt{display:flex;align-items:center;gap:12px;padding:13px 15px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;font:inherit;font-size:16px;text-align:left;transition:.12s;width:100%;}
.rt-opt .mk{width:20px;height:20px;border:2px solid var(--line);flex:none;transition:.12s;}
.rt-opt.rad .mk{border-radius:50%;}
.rt-opt.chk .mk{border-radius:5px;}
.rt-opt:hover:not(:disabled){border-color:var(--brand);}
.rt-opt.sel{border-color:var(--brand);background:var(--brand-050);}
.rt-opt.sel .mk{border-color:var(--brand);background:var(--brand);box-shadow:inset 0 0 0 3px #fff;}
.rt-opt.sel.chk .mk{box-shadow:none;background:var(--brand);}
.rt-opt.ok{border-color:var(--ok);background:var(--ok-bg);}
.rt-opt.ok .mk{border-color:var(--ok);background:var(--ok);box-shadow:inset 0 0 0 3px #fff;}
.rt-opt.ok.chk .mk{box-shadow:none;}
.rt-opt.bad{border-color:var(--err);background:var(--err-bg);}
.rt-opt.bad .mk{border-color:var(--err);background:var(--err);box-shadow:inset 0 0 0 3px #fff;}
.rt-opt.bad.chk .mk{box-shadow:none;}
.rt-opt:disabled{cursor:default;}

.rt-match{display:flex;flex-direction:column;gap:11px;}
.rt-mrow{display:flex;align-items:center;gap:12px;}
.rt-mrow .lf{font-family:'Lora',serif;font-size:17px;font-weight:600;min-width:120px;}
.rt-mrow select{flex:1;padding:12px;border:1.5px solid var(--line);border-radius:10px;font:inherit;font-size:15px;background:var(--surface);cursor:pointer;}
.rt-mrow select:focus{outline:none;border-color:var(--brand);}
.rt-mrow select.ok{border-color:var(--ok);background:var(--ok-bg);}
.rt-mrow select.bad{border-color:var(--err);background:var(--err-bg);}

.rt-fb{margin-top:18px;padding:13px 15px;border-radius:10px;font-size:14.5px;font-weight:500;line-height:1.45;}
.rt-fb.ok{background:var(--ok-bg);color:#127049;}
.rt-fb.bad{background:var(--err-bg);color:#a53c26;}

.rt-simple{font-size:15px;line-height:1.55;margin:0;}
.rt-full{margin-top:14px;font-family:'Lora',serif;font-size:15.5px;line-height:1.65;color:#33384f;white-space:pre-line;border-top:1px solid var(--line);padding-top:14px;}

/* scheme */
.scheme{margin-top:16px;display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.scheme-col{border-radius:12px;padding:15px;}
.scheme-col.a{background:var(--teal);}
.scheme-col.b{background:var(--coral);}
.scheme-h{font-weight:700;font-size:15px;margin-bottom:10px;}
.scheme-col.a .scheme-h{color:var(--teal-t);}
.scheme-col.b .scheme-h{color:var(--coral-t);}
.scheme-q{font-weight:600;font-size:14.5px;margin-bottom:8px;}
.scheme-r{font-size:13.5px;color:#3f4356;margin-bottom:6px;}
.scheme-r.ex{font-family:'Lora',serif;font-style:italic;}
.scheme-tip{grid-column:1/-1;background:var(--paper);border-radius:10px;padding:11px 14px;font-size:13.5px;color:var(--muted);}
.scheme-tip b{color:var(--brand-deep);}

.rt-act{margin-top:22px;display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;}
.rt-rule{margin-top:16px;border:1px solid var(--brand-100);border-radius:12px;padding:18px 18px 20px;background:#fbfbfe;}
.rt-rule-cta{font-size:25px;font-weight:800;line-height:1.18;color:var(--brand);letter-spacing:-.02em;margin-bottom:14px;}
.rt-btn{border:none;background:var(--brand);color:#fff;font:inherit;font-weight:700;font-size:15px;padding:12px 26px;border-radius:11px;cursor:pointer;transition:.12s;}
.rt-btn:hover:not(:disabled){background:var(--brand-deep);}
.rt-btn:disabled{background:#c3c7dd;cursor:default;}
.rt-btn.ghost{background:transparent;color:var(--brand);}
.rt-btn.ghost:hover{background:var(--brand-050);}

/* result */
.rt-result{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:30px;}
.rt-score{font-size:15px;color:var(--muted);text-align:center;}
.rt-score .big{display:block;font-size:52px;font-weight:800;letter-spacing:-.03em;color:var(--ink);margin:6px 0;}
.rt-score .big b{color:var(--brand);}
.rt-break{margin:26px 0 6px;}
.rt-break h4{font-size:14px;font-weight:700;margin:0 0 14px;}
.rt-brow{margin-bottom:14px;}
.rt-brow-top{display:flex;justify-content:space-between;font-size:14px;margin-bottom:5px;}
.rt-brow-top .st{font-weight:600;}
.rt-brow-top .sc{color:var(--muted);font-weight:600;}
.rt-brow-bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;}
.rt-brow-bar i{display:block;height:100%;border-radius:99px;}
.rt-weak-note{background:var(--err-bg);color:#a53c26;border-radius:10px;padding:13px 15px;font-size:14px;margin:18px 0;line-height:1.45;}
.rt-strong-note{background:var(--ok-bg);color:#127049;border-radius:10px;padding:13px 15px;font-size:14px;margin:18px 0;text-align:center;font-weight:500;}
.rt-result-btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px;}
.rt-result-btns .rt-btn{flex:1;min-width:150px;}
@media(max-width:560px){.scheme{grid-template-columns:1fr;}.rt-rule-cta{font-size:20px;}}
</style>
</head>
<body>
<div class="rt"><div class="rt-wrap" id="root"></div></div>
<script>
const VERB = {
  id: "verb",
  title: "Глагол",
  subtopics: [
    {
      id: "vidy",
      title: "Виды глагола",
      rule: {
        simple:
          "Задай глаголу вопрос. «Что делать?» — несовершенный вид, действие ещё идёт (читать). «Что сделать?» — совершенный вид, дело закончено (прочитать).",
        full:
          "Вид глагола показывает, как протекает действие.\n\nНесовершенный вид — действие длится, повторяется или не завершено; вопрос «что делать?»: читать, писать, решать. Есть все три времени: читаю, читал, буду читать.\n\nСовершенный вид — действие завершено, есть результат; вопрос «что сделать?»: прочитать, написать, решить. Настоящего времени нет — только прошедшее (прочитал) и будущее (прочитаю).\n\nМногие глаголы образуют видовые пары: решать — решить, писать — написать.",
        scheme: "vidy",
      },
      questions: [
        { id: "vd1", type: "single", mode: "theory", level: "A",
          prompt: "На какой вопрос отвечает глагол совершенного вида?",
          options: ["что делать?", "что сделать?", "какой?", "что?"],
          correct: 1, answerText: "что сделать?" },
        { id: "vd2", type: "single", mode: "theory", level: "B",
          prompt: "У глаголов какого вида нет формы настоящего времени?",
          options: ["несовершенного", "совершенного", "у обоих есть", "ни у одного"],
          correct: 1, answerText: "совершенного",
          explain: "Совершенный вид — про законченное действие, поэтому «сейчас» его не скажешь: «прочитал» — уже, «прочитаю» — потом, а «прочитаю сейчас» не бывает." },
        { id: "vd3", type: "single", mode: "practice", level: "A",
          prompt: "Укажите глагол совершенного вида.",
          options: ["читать", "прочитать", "писать", "бежать"],
          correct: 1, answerText: "прочитать" },
        { id: "vd4", type: "multi", mode: "practice", level: "B",
          prompt: "Отметьте все глаголы несовершенного вида.",
          options: ["думать", "сделать", "идти", "написать", "рисовать", "прыгнуть"],
          correct: [0, 2, 4], answerText: "думать, идти, рисовать" },
        { id: "vd5", type: "context", mode: "practice", level: "B",
          context: "Он долго решал задачу и наконец решил её.",
          prompt: "Какого вида глагол «решал»?",
          options: ["совершенного", "несовершенного", "двувидовой", "определить нельзя"],
          correct: 1, answerText: "несовершенного",
          explain: "«Долго решал» — действие тянулось, ещё не закончено (что делал?). А «решил» рядом — уже готово (что сделал?)." },
        { id: "vd6", type: "match", mode: "practice", level: "C",
          prompt: "Определите вид глагола.",
          lefts: ["прочитать", "читать"],
          matchOptions: ["совершенный", "несовершенный", "переходный", "возвратный"],
          matchCorrect: [0, 1],
          answerText: "прочитать — совершенный, читать — несовершенный",
          explain: "«Переходный» и «возвратный» — это другие признаки глагола, здесь они лишние. Спрашивают только про вид: что сделать? (прочитать) и что делать? (читать)." },
      ],
    },
    {
      id: "perehod",
      title: "Переходность",
      rule: {
        simple:
          "Проверь: можно ли поставить после глагола слово в винительном падеже без предлога (вижу кого? что?). «Читать (что?) книгу» — переходный. «Идти» — нельзя «идти кого/что», значит непереходный.",
        full:
          "Переходные глаголы обозначают действие, которое переходит на предмет. При них есть или может быть прямое дополнение — существительное в винительном падеже без предлога: строить (что?) дом, любить (кого?) маму.\n\nНепереходные глаголы прямого дополнения при себе иметь не могут: идти, спать, радоваться.\n\nВажно: все возвратные глаголы (на -ся) — непереходные.",
      },
      questions: [
        { id: "ph1", type: "single", mode: "theory", level: "A",
          prompt: "Переходный глагол сочетается с существительным в каком падеже без предлога?",
          options: ["родительном", "винительном", "дательном", "творительном"],
          correct: 1, answerText: "винительном" },
        { id: "ph2", type: "single", mode: "theory", level: "B",
          prompt: "Какие глаголы всегда непереходные?",
          options: ["глаголы движения", "возвратные (на -ся)", "глаголы совершенного вида", "глаголы будущего времени"],
          correct: 1, answerText: "возвратные (на -ся)" },
        { id: "ph3", type: "single", mode: "practice", level: "A",
          prompt: "Укажите переходный глагол.",
          options: ["спать", "читать", "бежать", "сидеть"],
          correct: 1, answerText: "читать (что?) книгу" },
        { id: "ph4", type: "multi", mode: "practice", level: "B",
          prompt: "Отметьте все переходные глаголы.",
          options: ["строить", "гулять", "любить", "смеяться", "видеть", "расти"],
          correct: [0, 2, 4], answerText: "строить, любить, видеть" },
        { id: "ph5", type: "context", mode: "practice", level: "B",
          context: "Мальчик читает интересную книгу.",
          prompt: "Найдите глагол в предложении. Он переходный или непереходный?",
          options: ["переходный", "непереходный", "нельзя определить", "возвратный"],
          correct: 0, answerText: "переходный",
          explain: "После глагола есть прямое дополнение «книгу» — винительный падеж без предлога (читает что? книгу). Значит глагол переходный." },
        { id: "ph6", type: "match", mode: "practice", level: "C",
          prompt: "Определите переходность глагола.",
          lefts: ["строить", "сидеть"],
          matchOptions: ["переходный", "непереходный", "совершенный", "возвратный"],
          matchCorrect: [0, 1],
          answerText: "строить — переходный, сидеть — непереходный",
          explain: "«Совершенный» и «возвратный» — другие признаки, здесь лишние. Строить (что?) дом — переходный; у «сидеть» прямого дополнения нет — непереходный." },
      ],
    },
    {
      id: "vozvrat",
      title: "Возвратность",
      rule: {
        simple:
          "Смотри на конец слова. Есть -ся или -сь — глагол возвратный (умываться, учиться). Нет — невозвратный (умывать, учить).",
        full:
          "Возвратные глаголы имеют на конце постфикс -ся или -сь: умываться, смеяться, учиться, оделся.\n\nНевозвратные глаголы постфикса -ся не имеют: умывать, учить, читать.\n\nЧасто возвратность показывает, что действие направлено на самого себя (умываться = умывать себя) или происходит взаимно (обниматься, встречаться).\n\nВсе возвратные глаголы — непереходные.",
      },
      questions: [
        { id: "vz1", type: "single", mode: "theory", level: "A",
          prompt: "По какому признаку узнают возвратный глагол?",
          options: ["по приставке", "по постфиксу -ся (-сь)", "по окончанию -ть", "по ударению"],
          correct: 1, answerText: "по постфиксу -ся (-сь)" },
        { id: "vz2", type: "single", mode: "practice", level: "A",
          prompt: "Укажите возвратный глагол.",
          options: ["гулять", "смеяться", "читать", "бежать"],
          correct: 1, answerText: "смеяться" },
        { id: "vz3", type: "multi", mode: "practice", level: "B",
          prompt: "Отметьте все возвратные глаголы.",
          options: ["одеваться", "писать", "учиться", "думать", "встречаться", "рисовать"],
          correct: [0, 2, 4], answerText: "одеваться, учиться, встречаться" },
        { id: "vz4", type: "context", mode: "practice", level: "B",
          context: "Дети весело смеялись на перемене.",
          prompt: "Найдите глагол в предложении. Он возвратный?",
          options: ["да, возвратный", "нет, невозвратный", "нельзя определить", "это переходный глагол"],
          correct: 0, answerText: "да, возвратный (смеяться — есть -ся)" },
        { id: "vz5", type: "match", mode: "practice", level: "C",
          prompt: "Определите возвратность глагола.",
          lefts: ["умываться", "умывать"],
          matchOptions: ["возвратный", "невозвратный", "возвратное деепричастие", "переходный"],
          matchCorrect: [0, 1],
          answerText: "умываться — возвратный, умывать — невозвратный",
          explain: "Смотри на -ся: умываться (с -ся) — возвратный глагол, умывать (без -ся) — невозвратный. Ловушка — «возвратное деепричастие»: у него тоже есть -ся (умываясь), но умываться — это глагол в начальной форме, а не деепричастие. «Переходный» здесь тоже лишний." },
      ],
    },
    { id: "vremya", title: "Время", questions: [] },
    { id: "naklonenie", title: "Наклонение", questions: [] },
    {
      id: "spr",
      title: "Спряжение (1,2)",
      rule: {
        simple:

  STUB("mezhdometie", "Междометие и частица"),
  STUB("morfemika", "Морфемика"),
  STUB("slovoobr", "Словообразование"),
  STUB("slovosoch", "Словосочетание"),
  STUB("glavnye", "Главные члены предложения"),
  STUB("skazuemoe", "Сказуемое"),
  STUB("vtorostep", "Второстепенные члены предложения"),
  STUB("prostoe", "Простое предложение"),
  STUB("oslozhnennoe", "Осложнённое предложение"),
  STUB("stili", "Стили речи"),
  STUB("ssp", "Сложносочинённое предложение"),
  STUB("spp", "Сложноподчинённое предложение"),
  STUB("rech", "Прямая и косвенная речь"),
  STUB("bsp", "Бессоюзное предложение"),
];

// ── Схемы к правилам (возвращают HTML) ────────────────────────
function scheme(id) {
  if (id === "vidy") {
    return '<div class="scheme">' +
      '<div class="scheme-col a"><div class="scheme-h">Несовершенный вид</div><div class="scheme-q">вопрос: что делать?</div><div class="scheme-r">действие ещё идёт</div><div class="scheme-r ex">читать, писать, решать</div><div class="scheme-r">есть 3 времени</div></div>' +
      '<div class="scheme-col b"><div class="scheme-h">Совершенный вид</div><div class="scheme-q">вопрос: что сделать?</div><div class="scheme-r">действие закончено</div><div class="scheme-r ex">прочитать, написать, решить</div><div class="scheme-r">нет настоящего времени</div></div>' +
      '<div class="scheme-tip">Запомни: <b>С</b>овершенный — <b>С</b>делать, оба на «С».</div></div>';
  }
  if (id === "spr") {
    return '<div class="scheme">' +
      '<div class="scheme-col a"><div class="scheme-h">I спряжение</div><div class="scheme-r">гласная <b>Е</b> · -ут / -ют</div><div class="scheme-r ex">читать, играть, рисовать</div></div>' +
      '<div class="scheme-col b"><div class="scheme-h">II спряжение</div><div class="scheme-r">гласная <b>И</b> · -ат / -ят</div><div class="scheme-r">глаголы на <b>-ить</b></div><div class="scheme-r ex">строить, любить, говорить</div></div>' +
      '<div class="scheme-tip">Исключения: 11 глаголов (смотреть, видеть, гнать…) и разноспрягаемые хотеть, бежать.</div></div>';
  }
  if (id === "soglasnye") {
    return '<div class="scheme">' +
      '<div class="scheme-col a"><div class="scheme-h">Звонкие (с голосом)</div><div class="scheme-r ex">б, в, г, д, ж, з</div></div>' +
      '<div class="scheme-col b"><div class="scheme-h">Глухие (без голоса)</div><div class="scheme-r ex">п, ф, к, т, ш, с</div></div>' +
      '<div class="scheme-tip">Пары: б—п, в—ф, г—к, д—т, ж—ш, з—с. Сонорные <b>л, м, н, р, й</b> — всегда звонкие, пары не имеют.</div></div>';
  }
  if (id === "skl") {
    return '<div class="scheme" style="grid-template-columns:1fr 1fr 1fr">' +
      '<div class="scheme-col a"><div class="scheme-h">1-е скл.</div><div class="scheme-r">ж. и м. род на <b>-а, -я</b></div><div class="scheme-r ex">мама, земля, дядя</div></div>' +
      '<div class="scheme-col b"><div class="scheme-h">2-е скл.</div><div class="scheme-r">м. род без оконч.; ср. род на <b>-о, -е</b></div><div class="scheme-r ex">стол, конь, окно</div></div>' +
      '<div class="scheme-col a"><div class="scheme-h">3-е скл.</div><div class="scheme-r">ж. род на <b>-ь</b></div><div class="scheme-r ex">ночь, дочь, степь</div></div>' +
      '<div class="scheme-tip">Отдельно: разносклоняемые на -мя (время, имя) и слово путь.</div></div>';
  }
  return "";
}

// ── Вспомогательные ───────────────────────────────────────────
function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
function shuffle(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function buildPool(topic, mode, subtopicIds) {
  var pool = [];
  topic.subtopics.forEach(function (st) {
    if (subtopicIds && subtopicIds.indexOf(st.id) === -1) return;
    st.questions.forEach(function (q) {
      if (mode !== "both" && q.mode !== mode) return;
      var c = Object.assign({}, q, { subtopicId: st.id, subtopicTitle: st.title });
      pool.push(c);
    });
  });
  return pool;
}
function buildQuiz(topic, opts) {
  var mode = opts.mode, count = opts.count, subtopicIds = opts.subtopicIds, excludeIds = opts.excludeIds || [];
  var pool = buildPool(topic, mode, subtopicIds);
  var fresh = pool.filter(function (q) { return excludeIds.indexOf(q.id) === -1; });
  var ordered = shuffle(fresh);
  if (count !== "all" && ordered.length < count) {
    var seen = shuffle(pool.filter(function (q) { return excludeIds.indexOf(q.id) !== -1; }));
    ordered = ordered.concat(seen);
  }
  var n = count === "all" ? (fresh.length || pool.length) : Math.min(count, ordered.length);
  var src = ordered.length ? ordered : shuffle(pool);
  return src.slice(0, n);
}

// ── Состояние ─────────────────────────────────────────────────
var S = {
  screen: "home", topic: null, mode: "both", count: 10, selectedSubs: [],
  quiz: [], qi: 0, results: [], seenIds: [], retrained: false,
  sel: null, multi: [], match: [], checked: false, correct: false,
  attempts: 0, revealed: false, resolved: false, skipped: false,
};
var root = document.getElementById("root");
function findSubtopic(id) { return S.topic && S.topic.subtopics.filter(function (s) { return s.id === id; })[0]; }
function readySubs() { return S.topic ? S.topic.subtopics.filter(function (s) { return s.questions.length > 0; }) : []; }
function curQ() { return S.quiz[S.qi]; }

function resetAnswer() {
  S.sel = null; S.multi = []; S.match = [];
  S.checked = false; S.correct = false;
  S.attempts = 0; S.revealed = false; S.resolved = false; S.skipped = false;
}
function openTopic(t) {
  S.topic = t; S.mode = "both"; S.count = 10;
  S.selectedSubs = t.subtopics.filter(function (s) { return s.questions.length > 0; }).map(function (s) { return s.id; });
  S.screen = "setup"; render();
}
function startQuiz(built, isRetrain) {
  S.quiz = built; S.qi = 0; S.results = [];
  var ids = built.map(function (x) { return x.id; });
  ids.forEach(function (id) { if (S.seenIds.indexOf(id) === -1) S.seenIds.push(id); });
  S.retrained = !!isRetrain;
  resetAnswer(); S.screen = "quiz"; render();
}
function beginFromSetup() {
  if (S.selectedSubs.length === 0) return;
  var built = buildQuiz(S.topic, { mode: S.mode, count: S.count, subtopicIds: S.selectedSubs, excludeIds: [] });
  S.seenIds = [];
  startQuiz(built, false);
}
function hasAnswer() {
  var q = curQ(); if (!q) return false;
  if (q.type === "single" || q.type === "context") return S.sel !== null;
  if (q.type === "multi") return S.multi.length > 0;
  if (q.type === "match") return q.lefts.every(function (_, i) { return S.match[i] !== undefined && S.match[i] !== ""; });
  return false;
}
function evaluate() {
  var q = curQ();
  if (q.type === "single" || q.type === "context") return S.sel === q.correct;
  if (q.type === "multi") {
    var a = S.multi.slice().sort().join(",");
    var b = q.correct.slice().sort().join(",");
    return a === b;
  }
  if (q.type === "match") return q.matchCorrect.every(function (c, i) { return Number(S.match[i]) === c; });
  return false;
}
function check() {
  var q = curQ();
  var ok = evaluate();
  S.checked = true; S.correct = ok;
  if (S.attempts === 0) S.results.push({ qid: q.id, subtopicId: q.subtopicId, correct: ok });
  S.attempts += 1;
  if (ok) S.resolved = true; else S.revealed = true;
  render();
}
function retry() {
  S.checked = false; S.correct = false;
  S.sel = null; S.multi = []; S.match = [];
  render();
}
function skip() { S.skipped = true; S.resolved = true; S.checked = true; render(); }
function next() {
  if (S.qi + 1 >= S.quiz.length) { S.screen = "result"; }
  else { S.qi += 1; resetAnswer(); }
  render();
}
function breakdown() {
  var map = {};
  S.results.forEach(function (r) {
    if (!map[r.subtopicId]) map[r.subtopicId] = { total: 0, ok: 0 };
    map[r.subtopicId].total++; if (r.correct) map[r.subtopicId].ok++;
  });
  return Object.keys(map).map(function (id) {
    var v = map[id]; var st = findSubtopic(id);
    return { id: id, title: st ? st.title : id, total: v.total, ok: v.ok, wrong: v.total - v.ok };
  });
}
function retrainWeak() {
  var weak = breakdown().filter(function (b) { return b.wrong > 0; }).map(function (b) { return b.id; });
  var built = buildQuiz(S.topic, { mode: S.mode, count: "all", subtopicIds: weak, excludeIds: S.seenIds });
  startQuiz(built, true);
}

var KIND = { theory: "теория", practice: "практика" };

// ── Рендер ────────────────────────────────────────────────────
function render() {
  var h = "";
  // header
  h += '<div class="rt-top"><div class="rt-logo">Русский<b>·</b>ЕНТ</div>';
  if (S.screen !== "home") h += '<button class="rt-back" data-act="home">← К темам</button>';
  h += '</div>';

  if (S.screen === "home") h += viewHome();
  else if (S.screen === "setup") h += viewSetup();
  else if (S.screen === "quiz") h += viewQuiz();
  else if (S.screen === "result") h += viewResult();

  root.innerHTML = h;
  wire();
}

function viewHome() {
  var h = '<h1 class="rt-h1">Тренажёр по русскому языку</h1>';
  h += '<p class="rt-lead">Темы идут в порядке курса. Выбери тему — дальше можно настроить режим и число вопросов. При ошибке откроется разбор с простым объяснением и правилом.</p>';
  h += '<div class="rt-topics">';
  TOPICS.forEach(function (t) {
    var ready = t.subtopics.some(function (s) { return s.questions.length > 0; });
    h += '<button class="rt-topic' + (ready ? " ready" : "") + '"' + (ready ? ' data-topic="' + t.id + '"' : "") + '>' +
      '<div class="name">' + esc(t.title) + '</div>' +
      '<div class="meta">' + (ready ? "готово · начать" : "скоро") + '</div></button>';
  });
  h += '</div>';
  return h;
}

function viewSetup() {
  var rs = readySubs();
  var h = '<h1 class="rt-h1">' + esc(S.topic.title) + '</h1>';
  h += '<p class="rt-lead">Настрой тренировку под себя.</p>';
  h += '<div class="rt-card">';
  h += '<div class="rt-setup-h" style="margin-top:0">Какие темы?</div><div class="rt-choices">';
  h += '<button class="rt-choice' + (S.selectedSubs.length === rs.length ? " sel" : "") + '" data-all>Все темы</button>';
  S.topic.subtopics.forEach(function (st) {
    if (st.questions.length === 0) {
      h += '<button class="rt-choice soon" disabled>' + esc(st.title) + '<span class="sub">скоро</span></button>';
    } else {
      var on = S.selectedSubs.indexOf(st.id) !== -1;
      h += '<button class="rt-choice' + (on ? " sel" : "") + '" data-sub="' + st.id + '">' + esc(st.title) + '</button>';
    }
  });
  h += '</div>';

  h += '<div class="rt-setup-h">Что тренируем?</div><div class="rt-choices">';
  [["theory", "Теория", "правила"], ["practice", "Практика", "примеры"], ["both", "Вместе", "теория + практика"]].forEach(function (m) {
    h += '<button class="rt-choice' + (S.mode === m[0] ? " sel" : "") + '" data-mode="' + m[0] + '">' + m[1] + '<span class="sub">' + m[2] + '</span></button>';
  });
  h += '</div>';

  h += '<div class="rt-setup-h">Сколько вопросов?</div><div class="rt-choices">';
  [5, 10, 20, "all"].forEach(function (c) {
    h += '<button class="rt-choice' + (S.count === c ? " sel" : "") + '" data-count="' + c + '">' + (c === "all" ? "Все" : c) + '</button>';
  });
  h += '</div>';

  var none = S.selectedSubs.length === 0;
  h += '<button class="rt-start" data-start' + (none ? " disabled" : "") + '>' + (none ? "Выберите хотя бы одну тему" : "Начать тренировку") + '</button>';
  h += '</div>';
  return h;
}

function viewQuiz() {
  var q = curQ();
  var h = '<div class="rt-prog"><div class="rt-bar"><i style="width:' + ((S.qi / S.quiz.length) * 100) + '%"></i></div>' +
    '<span class="rt-num">' + (S.qi + 1) + ' / ' + S.quiz.length + '</span></div>';
  h += '<div class="rt-q">';
  h += '<div class="rt-tags"><span class="rt-tag">' + esc(q.subtopicTitle) + '</span>' +
    '<span class="rt-tag">' + KIND[q.mode] + '</span>' +
    '<span class="rt-tag lvl">уровень ' + q.level + '</span></div>';
  if (q.type === "context") h += '<div class="rt-ctx">' + esc(q.context) + '</div>';
  h += '<p class="rt-prompt">' + esc(q.prompt) + '</p>';

  var reveal = S.correct || S.skipped;
  if (q.type === "single" || q.type === "context") {
    h += '<div class="rt-opts">';
    q.options.forEach(function (opt, i) {
      var c = "rt-opt rad";
      if (!S.checked && S.sel === i) c += " sel";
      if (reveal && i === q.correct) c += " ok";
      if (S.checked && !S.correct && S.sel === i && i !== q.correct) c += " bad";
      h += '<button class="' + c + '"' + (S.checked ? " disabled" : "") + ' data-opt="' + i + '"><span class="mk"></span>' + esc(opt) + '</button>';
    });
    h += '</div>';
  } else if (q.type === "multi") {
    h += '<div class="rt-opts">';
    q.options.forEach(function (opt, i) {
      var on = S.multi.indexOf(i) !== -1;
      var c = "rt-opt chk";
      if (!S.checked && on) c += " sel";
      if (reveal && q.correct.indexOf(i) !== -1) c += " ok";
      if (S.checked && !S.correct && on && q.correct.indexOf(i) === -1) c += " bad";
      h += '<button class="' + c + '"' + (S.checked ? " disabled" : "") + ' data-multi="' + i + '"><span class="mk"></span>' + esc(opt) + '</button>';
    });
    h += '</div>';
  } else if (q.type === "match") {
    h += '<div class="rt-match">';
    q.lefts.forEach(function (lf, i) {
      var c = "";
      if (reveal && Number(S.match[i]) === q.matchCorrect[i]) c = "ok";
      else if (S.checked && !S.correct && Number(S.match[i]) !== q.matchCorrect[i]) c = "bad";
      var opts = '<option value="" disabled' + (S.match[i] === undefined || S.match[i] === "" ? " selected" : "") + '>выберите…</option>';
      q.matchOptions.forEach(function (o, oi) {
        opts += '<option value="' + oi + '"' + (String(S.match[i]) === String(oi) ? " selected" : "") + '>' + esc(o) + '</option>';
      });
      h += '<div class="rt-mrow"><span class="lf">' + esc(lf) + '</span>' +
        '<select class="' + c + '"' + (S.checked ? " disabled" : "") + ' data-match="' + i + '">' + opts + '</select></div>';
    });
    h += '</div>';
  }

  if (S.checked) {
    var msg;
    if (S.correct) msg = "Верно. " + q.answerText;
    else if (S.skipped) msg = "Вопрос пропущен. Правильный ответ: " + q.answerText;
    else msg = "Неверно. Прочитайте правило ниже и ответьте ещё раз.";
    h += '<div class="rt-fb ' + (S.correct ? "ok" : "bad") + '">' + esc(msg) + '</div>';
  }

  if (S.revealed) {
    var st = findSubtopic(q.subtopicId);
    var simple = q.explain || st.rule.simple;
    h += '<div class="rt-rule">' +
      '<div class="rt-rule-cta">Ознакомьтесь с правилом и пройдите вопрос заново</div>' +
      '<p class="rt-simple">' + esc(simple) + '</p>' +
      '<div class="rt-full">' + esc(st.rule.full) + '</div>';
    if (st.rule.scheme) h += scheme(st.rule.scheme);
    h += '</div>';
  }

  h += '<div class="rt-act">';
  if (!S.checked) {
    h += '<button class="rt-btn" data-check' + (hasAnswer() ? "" : " disabled") + '>Проверить</button>';
  } else if (S.resolved) {
    h += '<button class="rt-btn" data-next>' + (S.qi + 1 >= S.quiz.length ? "Завершить" : "Дальше →") + '</button>';
  } else {
    if (S.attempts >= 2) h += '<button class="rt-btn ghost" data-skip>Пропустить вопрос</button>';
    h += '<button class="rt-btn" data-retry>Ответить ещё раз</button>';
  }
  h += '</div></div>';
  return h;
}

function viewResult() {
  var bd = breakdown();
  var weak = bd.filter(function (b) { return b.wrong > 0; });
  var scoreOk = S.results.filter(function (r) { return r.correct; }).length;
  var h = '<div class="rt-result">';
  h += '<div class="rt-score">' + (S.retrained ? "Тренировка слабых мест" : esc(S.topic.title)) +
    '<span class="big"><b>' + scoreOk + '</b> / ' + S.results.length + '</span>' +
    (scoreOk === S.results.length ? "Всё верно — отличная работа!" : "Разбор по подтемам ниже.") + '</div>';

  h += '<div class="rt-break"><h4>Где были ошибки</h4>';
  bd.forEach(function (b) {
    var pct = b.total ? (b.ok / b.total) * 100 : 0;
    var col = b.wrong === 0 ? "var(--ok)" : (pct >= 50 ? "var(--brand)" : "var(--err)");
    h += '<div class="rt-brow"><div class="rt-brow-top"><span class="st">' + esc(b.title) + '</span>' +
      '<span class="sc">' + b.ok + ' из ' + b.total + '</span></div>' +
      '<div class="rt-brow-bar"><i style="width:' + pct + '%;background:' + col + '"></i></div></div>';
  });
  h += '</div>';

  if (weak.length > 0) {
    h += '<div class="rt-weak-note">Слабые места: ' + esc(weak.map(function (b) { return b.title; }).join(", ")) +
      '. Можно потренировать их отдельно — с другими примерами.</div>';
  } else {
    h += '<div class="rt-strong-note">Слабых мест нет — можно двигаться к следующей теме.</div>';
  }

  h += '<div class="rt-result-btns">';
  if (weak.length > 0) h += '<button class="rt-btn" data-retrain>Потренировать слабые места</button>';
  h += '<button class="rt-btn ghost" data-act="setup">Новая тренировка</button>';
  h += '<button class="rt-btn ghost" data-act="home">К темам</button>';
  h += '</div></div>';
  return h;
}

// ── Обработчики событий ───────────────────────────────────────
function wire() {
  root.querySelectorAll("[data-topic]").forEach(function (el) {
    el.addEventListener("click", function () {
      var t = TOPICS.filter(function (x) { return x.id === el.getAttribute("data-topic"); })[0];
      if (t) openTopic(t);
    });
  });
  root.querySelectorAll("[data-act]").forEach(function (el) {
    el.addEventListener("click", function () {
      var a = el.getAttribute("data-act");
      if (a === "home") { S.screen = "home"; render(); }
      else if (a === "setup") { S.screen = "setup"; render(); }
    });
  });

  var allBtn = root.querySelector("[data-all]");
  if (allBtn) allBtn.addEventListener("click", function () {
    S.selectedSubs = readySubs().map(function (s) { return s.id; }); render();
  });
  root.querySelectorAll("[data-sub]").forEach(function (el) {
    el.addEventListener("click", function () {
      var id = el.getAttribute("data-sub");
      var i = S.selectedSubs.indexOf(id);
      if (i === -1) S.selectedSubs.push(id); else S.selectedSubs.splice(i, 1);
      render();
    });
  });
  root.querySelectorAll("[data-mode]").forEach(function (el) {
    el.addEventListener("click", function () { S.mode = el.getAttribute("data-mode"); render(); });
  });
  root.querySelectorAll("[data-count]").forEach(function (el) {
    el.addEventListener("click", function () {
      var v = el.getAttribute("data-count"); S.count = (v === "all" ? "all" : Number(v)); render();
    });
  });
  var startBtn = root.querySelector("[data-start]");
  if (startBtn) startBtn.addEventListener("click", beginFromSetup);

  root.querySelectorAll("[data-opt]").forEach(function (el) {
    el.addEventListener("click", function () { S.sel = Number(el.getAttribute("data-opt")); render(); });
  });
  root.querySelectorAll("[data-multi]").forEach(function (el) {
    el.addEventListener("click", function () {
      var i = Number(el.getAttribute("data-multi"));
      var k = S.multi.indexOf(i);
      if (k === -1) S.multi.push(i); else S.multi.splice(k, 1);
      render();
    });
  });
  root.querySelectorAll("[data-match]").forEach(function (el) {
    el.addEventListener("change", function () {
      S.match[Number(el.getAttribute("data-match"))] = el.value; render();
    });
  });

  var cb = root.querySelector("[data-check]"); if (cb) cb.addEventListener("click", function () { if (hasAnswer()) check(); });
  var nb = root.querySelector("[data-next]"); if (nb) nb.addEventListener("click", next);
  var rb = root.querySelector("[data-retry]"); if (rb) rb.addEventListener("click", retry);
  var sb = root.querySelector("[data-skip]"); if (sb) sb.addEventListener("click", skip);
  var tb = root.querySelector("[data-retrain]"); if (tb) tb.addEventListener("click", retrainWeak);
}

render();
</script>
